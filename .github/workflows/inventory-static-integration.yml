name: Integrate inventory static proposal

on:
  push:
    branches:
      - inventory-sync-review
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inventory-static-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the static proposal owner
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: inventory-sync-review
          fetch-depth: 0

      - name: Inspect the full proposal history
        id: proposal
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main inventory-sync-review
          proposal_sha="$(git rev-parse origin/inventory-sync-review)"
          main_sha="$(git rev-parse origin/main)"
          base_sha="$(git merge-base "$main_sha" "$proposal_sha")"
          echo "proposal_sha=${proposal_sha}" >> "$GITHUB_OUTPUT"
          echo "main_sha=${main_sha}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"

          if [[ "$(git rev-list --count origin/main..origin/inventory-sync-review)" == "0" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            if [[ "$proposal_sha" != "$main_sha" ]]; then
              git push \
                --force-with-lease="refs/heads/inventory-sync-review:${proposal_sha}" \
                origin "${main_sha}:refs/heads/inventory-sync-review"
            fi
            exit 0
          fi

          if git diff --quiet origin/main origin/inventory-sync-review --; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            git push \
              --force-with-lease="refs/heads/inventory-sync-review:${proposal_sha}" \
              origin "${main_sha}:refs/heads/inventory-sync-review"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Check out the current integration tree
        if: steps.proposal.outputs.has_changes == 'true'
        run: git checkout --detach "${{ steps.proposal.outputs.main_sha }}"

      - name: Set up Node.js
        if: steps.proposal.outputs.has_changes == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.proposal.outputs.has_changes == 'true'
        run: npm ci

      - name: Resolve the proposal through its historical data tree
        if: steps.proposal.outputs.has_changes == 'true'
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          npm run inventory:static-proposal:merge -- \
            --base "${{ steps.proposal.outputs.base_sha }}" \
            --current "${{ steps.proposal.outputs.main_sha }}" \
            --proposal "${{ steps.proposal.outputs.proposal_sha }}" \
            --write data/retail-offers.ts
          if git diff --quiet -- data/retail-offers.ts; then
            echo "integrated_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "jelocare-inventory-integration[bot]"
          git config user.email "jelocare-inventory-integration[bot]@users.noreply.github.com"
          git add data/retail-offers.ts
          git commit -m "sync: integrate inventory proposal ${{ steps.proposal.outputs.proposal_sha }}"
          echo "integrated_changes=true" >> "$GITHUB_OUTPUT"

      - name: Validate the exact static proposal
        if: steps.merge.outputs.integrated_changes == 'true'
        run: npm run inventory:static-proposal:validate -- --base origin/main --head HEAD

      - name: Verify release integrity
        if: steps.merge.outputs.integrated_changes == 'true'
        run: npm run verify:release

      - name: Verify private research integrity
        if: steps.merge.outputs.integrated_changes == 'true'
        run: npm run verify:research-integrity

      - name: Build without database mutation
        if: steps.merge.outputs.integrated_changes == 'true'
        run: npm run build
        env:
          SKIP_DATABASE_MIGRATIONS: "1"

      - name: Advance the gated result or its idempotent baseline
        if: steps.proposal.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main inventory-sync-review
          test "$(git rev-parse origin/main)" = "${{ steps.proposal.outputs.main_sha }}"
          test "$(git rev-parse origin/inventory-sync-review)" = "${{ steps.proposal.outputs.proposal_sha }}"
          if [[ "${{ steps.merge.outputs.integrated_changes }}" == "true" ]]; then
            git push --atomic \
              --force-with-lease="refs/heads/inventory-sync-review:${{ steps.proposal.outputs.proposal_sha }}" \
              origin \
              HEAD:refs/heads/main \
              HEAD:refs/heads/inventory-sync-review
          else
            git push \
              --force-with-lease="refs/heads/inventory-sync-review:${{ steps.proposal.outputs.proposal_sha }}" \
              origin \
              "${{ steps.proposal.outputs.main_sha }}:refs/heads/inventory-sync-review"
          fi
